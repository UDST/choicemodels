name: Publish

# Builds the distributions for a GitHub release and uploads them to PyPI using
# Trusted Publishing. Merging to main never publishes anything; only publishing a
# release on GitHub (which creates or points at a v* tag) does, and the upload
# step waits for approval in the protected "pypi" environment. See CONTRIBUTING.md.

on:
  release:
    types: [published]
  workflow_dispatch:  # build and verify only, without publishing

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      - name: Install the wheel and run the tests against it
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "import choicemodels; print('installed version', choicemodels.__version__)"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: Check that the package version matches the release
        if: github.event_name == 'release'
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'import choicemodels; print(choicemodels.__version__)')"
          echo "tag $GITHUB_REF_NAME expects version $expected; package reports $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the package version does not match the release tag"
            exit 1
          fi
          if [[ "$actual" =~ (a|b|rc|dev)[0-9]*$ ]] && [ "$PRERELEASE" != "true" ]; then
            echo "::error::$actual is a pre-release version, but the GitHub release is not marked as a pre-release"
            exit 1
          fi

      - name: Save distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/choicemodels/
    permissions:
      id-token: write  # for Trusted Publishing; no other access is needed

    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
