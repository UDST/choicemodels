name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lower support boundary: oldest Python plus the minimum
          # supported versions of the core dependencies
          - name: Python 3.10 + minimum deps
            os: ubuntu-latest
            python-version: "3.10"
            pip-args: -c requirements-min.txt
          # Forward boundary: newest supported Python plus current
          # versions of all dependencies, on each operating system
          - name: Python 3.14 + latest deps
            os: ubuntu-latest
            python-version: "3.14"
            pip-args: ""
          - name: Python 3.14 + latest deps (macOS)
            os: macos-latest
            python-version: "3.14"
            pip-args: ""
          - name: Python 3.14 + latest deps (Windows)
            os: windows-latest
            python-version: "3.14"
            pip-args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-min.txt

      - name: Install package and test dependencies
        run: python -m pip install ".[test]" ${{ matrix.pip-args }}

      - name: Show dependency versions
        run: python -c "import numpy, pandas, scipy, statsmodels; print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('scipy', scipy.__version__); print('statsmodels', statsmodels.__version__)"

      - name: Run tests
        run: python -m pytest --cov

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check source
        run: ruff check choicemodels tests

  build:
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install and import wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd /tmp
          python -c "import choicemodels; print(choicemodels.__version__)"
